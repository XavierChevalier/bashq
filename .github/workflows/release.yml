name: Release

# On every push to main, release-please keeps a "chore: release X.Y.Z" pull
# request up to date: next version from the commit messages (Conventional
# Commits), CHANGELOG.md section, version shown in the docs. Merging that
# pull request tags vX.Y.Z and publishes the GitHub release with its
# changelog section; the job below attaches the binaries (GoReleaser).
# See CONTRIBUTING.md#releases.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A personal token lets the release pull request trigger CI; the
          # default token cannot (GitHub blocks workflow chains it starts).
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  binaries:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: The binary reports the released version
        run: |
          version="${{ needs.release-please.outputs.tag_name }}"
          test "$(dist/bashq_linux_amd64_v1/bashq version)" = "bashq ${version#v}"
